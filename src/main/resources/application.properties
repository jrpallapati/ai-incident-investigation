spring.application.name=ai-incident-investigation
spring.ai.openai.api-key=${OPENAI_API_KEY}
# Default temperature for general-purpose reasoning; individual agents can override via request options
spring.ai.openai.temperature=0.2

# MongoDB (use environment variable) - support both property styles for compatibility
spring.mongodb.uri=${MONGODB_URI}
spring.mongodb.database=incident-investigation

# OpenAI models (configurable via properties)
spring.ai.openai.chat.model=gpt-4o
spring.ai.openai.embedding.model=text-embedding-3-small

# MongoDB Atlas Vector Store configuration (align with existing data)
spring.ai.vectorstore.type=mongodb-atlas
spring.ai.vectorstore.mongodb.atlas.collection-name=vector_store
spring.ai.vectorstore.mongodb.atlas.vector-index-name=default
spring.ai.vectorstore.mongodb.atlas.path-name=embedding

# Application settings
app.logs.path=./sample-logs
app.ingestion.enabled=true
